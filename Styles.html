<!-- Styles are intentionally embedded in page templates for portability. -->
<script>
/*
 * Homepage bootstrap guard.
 * The Index.html page registers its original init() listener after this
 * include. Replace that listener's execution by invoking the lightweight
 * user-dashboard bootstrap first and stopping the old listener from running.
 */
document.addEventListener('DOMContentLoaded', function (event) {
  if (!document.getElementById('loadingScreen') || typeof google === 'undefined' || !google.script || !google.script.run) return;

  window.init = async function () {
    try {
      hideScreens();
      $('loadingScreen').style.display = 'flex';

      const user = await srv('getCurrentUser');

      if (!user || user.authorized !== true) {
        if (user) {
          setText('unauthorizedMessage', user.message || 'Akaun tidak dibenarkan.');
          setText('unauthorizedEmail', user.email || '-');
          hideScreens();
          $('unauthorizedScreen').style.display = 'block';
          return;
        }
        throw new Error('Maklumat pengguna tidak diterima.');
      }

      currentUser = user;
      const role = String(user.role || '').toUpperCase();

      if (role === 'ADMIN' || role === 'SECRETARIAT') {
        const base = await srv('getDashboardData');
        if (!base || base.authorized !== true) {
          throw new Error((base && base.message) || 'Maklumat dashboard tidak diterima.');
        }
        dashboardData = base;
        renderHeader(user);
        renderPeriodInfo(base.period);
        renderReport({
          user: user,
          period: base.period,
          report: base.report,
          reportUrl: base.reportUrl
        });
        renderAdmin(base);
        $('dashboard').style.display = 'block';
        $('loadingScreen').style.display = 'none';
        return;
      }

      const list = await srv('getUserReportingPeriods');
      if (!Array.isArray(list) || !list.length) {
        throw new Error('Tiada tempoh laporan tersedia.');
      }

      const currentId = list[0] && list[0].PeriodID ? list[0].PeriodID : '';
      setupPeriods(list, currentId);
      await loadSelectedPeriod(currentId);
    } catch (e) {
      showError(e);
    }
  };

  /* The original Index.html listener is registered after this include.
     Prevent it from invoking the old getDashboardData-first init(). */
  event.stopImmediatePropagation();
  window.init();
}, { once: true });
</script>
