<script>
/*
 * ============================================================
 * CGSO - SECRETARIAT DASHBOARD UI ENHANCEMENT
 * ============================================================
 * Lightweight UI helper layer. Loaded through include() when used.
 * This file is intentionally standalone so the main Secretariat
 * dashboard can be enhanced without touching Code.gs.
 * ============================================================
 */

function formatPercent_(value) {
  var n = Number(value || 0);
  if (!isFinite(n)) n = 0;
  return Math.max(0, Math.min(100, Math.round(n))) + '%';
}

function normalizeStatus_(value) {
  return String(value || 'NOT_STARTED').trim().toUpperCase();
}

function statusLabelMs_(value) {
  var s = normalizeStatus_(value);
  return s === 'SUBMITTED' ? 'TELAH HANTAR' :
         s === 'DRAFT' ? 'DRAF' :
         s === 'CLOSED' ? 'DITUTUP' : 'BELUM MULA';
}
</script>
