<script>
/* Shared Secretariat dashboard UI helpers. */
function formatPercent_(value) {
  var n = Number(value || 0);
  if (!isFinite(n)) n = 0;
  return Math.max(0, Math.min(100, Math.round(n))) + '%';
}
function normalizeStatus_(value) {
  return String(value || 'NOT_STARTED').trim().toUpperCase();
}
function statusLabelMs_(value) {
  var s = normalizeStatus_(value);
  return s === 'SUBMITTED' ? 'TELAH HANTAR' : s === 'DRAFT' ? 'DRAF' : s === 'CLOSED' ? 'DITUTUP' : 'BELUM MULA';
}
</script>
