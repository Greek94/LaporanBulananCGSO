<!DOCTYPE html>
<html><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Urus Setia</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f4f6f9;color:#1f2937}.wrap{max-width:1400px;margin:auto}.card,.header{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.header{padding:24px;margin-bottom:18px}.title{margin:0 0 7px;color:#17365d;font-size:26px}.sub{margin:0;color:#6b7280;font-size:14px}.tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:16px}.f{display:flex;flex-direction:column;gap:5px}.f label{font-size:12px;font-weight:700;color:#64748b}select,input{padding:11px 13px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:13px}.sel{min-width:180px}.periodBtn{height:42px;padding:0 18px;border:0;border-radius:8px;background:#17365d;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}.periodBtn:hover:not(:disabled){background:#0f2745}.periodBtn:disabled{opacity:.5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px}.sl{font-size:13px;color:#6b7280;margin-bottom:7px}.sv{font-size:28px;font-weight:700;color:#17365d}.prog{padding:20px;margin-bottom:18px}.bar{height:18px;background:#e5e7eb;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#2563eb}.pt{margin-top:7px;font-size:13px;color:#6b7280}.table{padding:18px;overflow:auto}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:240px}.btn{border:0;border-radius:7px;padding:9px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn.dark{background:#17365d}.btn:disabled{opacity:.5;cursor:not-allowed}table{width:100%;border-collapse:collapse;min-width:820px}th{background:#f8fafc;padding:12px;text-align:left;font-size:13px;border-bottom:2px solid #e5e7eb}td{padding:12px;border-bottom:1px solid #e5e7eb;font-size:13px}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.DRAFT{background:#fff7ed;color:#c2410c}.SUBMITTED{background:#ecfdf5;color:#047857}.CLOSED{background:#f3f4f6;color:#374151}.NOT_STARTED{background:#eff6ff;color:#1d4ed8}.loading,.error{padding:28px;background:#fff;border-radius:12px}.error{color:#b91c1c;white-space:pre-wrap}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;padding:20px;overflow:auto}.panel{max-width:1150px;margin:auto;background:#fff;border-radius:12px;padding:22px}.mh{display:flex;justify-content:space-between;gap:15px}.mt{margin:0;color:#17365d}.meta{color:#6b7280;font-size:13px;margin:8px 0 16px}.sec{border:1px solid #e5e7eb;border-radius:9px;margin:10px 0;overflow:hidden}.sect{padding:11px 13px;background:#f8fafc;font-weight:700;color:#17365d}.item{padding:13px;border-top:1px solid #e5e7eb}.item:first-child{border-top:0}.code{background:#17365d;color:#fff;border-radius:5px;padding:4px 7px;font-size:11px;font-weight:700;margin-right:7px}.pill{float:right;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700}.ada{background:#ecfdf5;color:#047857}.tiada{background:#f3f4f6;color:#374151}.act{margin-top:8px;padding:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.v{padding:7px 9px;background:#fff;border:1px solid #e5e7eb;border-radius:6px}.v b{display:block;font-size:10px;color:#64748b}.v span{display:block;margin-top:2px;white-space:pre-wrap}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding:10px}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.header{padding:18px}}
</style></head><body><div class="wrap">
<div class="header"><h1 class="title">DASHBOARD URUS SETIA</h1><p class="sub" id="periodText">Memuatkan tempoh laporan...</p><div class="tools"><div class="f"><label for="yearSelect">TAHUN</label><select id="yearSelect" class="sel" onchange="yearChanged()" disabled><option>Memuatkan...</option></select></div><div class="f"><label for="monthSelect">BULAN</label><select id="monthSelect" class="sel" onchange="monthChanged()" disabled><option>Memuatkan...</option></select></div><button type="button" id="applyPeriodBtn" class="periodBtn" onclick="applySelectedPeriod()" disabled>🔎 Papar Tempoh</button><span style="font-size:12px;color:#6b7280">Pilih tahun dan bulan, kemudian klik Papar Tempoh.</span></div></div>
<div id="loading" class="loading">Memuatkan data...</div><div id="error" class="error" style="display:none"></div><div id="content" style="display:none">
<div class="stats"><div class="card stat"><div class="sl">Jumlah Organisasi</div><div id="total" class="sv">0</div></div><div class="card stat"><div class="sl">Telah Hantar</div><div id="submitted" class="sv">0</div></div><div class="card stat"><div class="sl">Draf</div><div id="draft" class="sv">0</div></div><div class="card stat"><div class="sl">Belum Mula</div><div id="notStarted" class="sv">0</div></div><div class="card stat"><div class="sl">Ditutup</div><div id="closed" class="sv">0</div></div></div>
<div class="card prog"><b>Kemajuan Laporan</b><div class="bar" style="margin-top:10px"><div id="fill" class="fill"></div></div><div id="progressText" class="pt">0%</div></div>
<div class="card table"><div class="toolbar"><input id="search" class="search" placeholder="Cari organisasi atau kod..." oninput="filterTable()"><select id="statusFilter" class="sel" onchange="filterTable()"><option value="ALL">Semua Status</option><option value="SUBMITTED">Telah Hantar</option><option value="DRAFT">Draf</option><option value="NOT_STARTED">Belum Mula</option><option value="CLOSED">Ditutup</option></select><button class="btn dark" onclick="loadDashboard()">↻ Segar Semula</button><span id="count" style="font-size:12px;color:#6b7280"></span></div><table><thead><tr><th>Bil.</th><th>Organisasi</th><th>Kod</th><th>Status</th><th>Kemajuan</th><th>Tindakan</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div>
<div id="modal" class="modal"><div class="panel"><div class="mh"><div><h2 id="modalTitle" class="mt">Laporan</h2><div id="modalMeta" class="meta"></div></div><button class="btn dark" onclick="closeReport()">Tutup</button></div><div id="modalBody">Memuatkan laporan...</div></div></div>
<script>
const months=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];let rows=[],periods=[],currentPeriodId='';
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function parts(id){let m=String(id||'').match(/^(\d{4})-(\d{2})$/);return m?{year:+m[1],month:+m[2]}:null}
function status(s){s=String(s||'NOT_STARTED').toUpperCase();return `<span class="status ${s}">${s==='SUBMITTED'?'TELAH HANTAR':s==='DRAFT'?'DRAF':s==='CLOSED'?'DITUTUP':'BELUM MULA'}</span>`}
function dateText(v){if(!v)return '';if(typeof v==='object'&&v.year!=null)return `${String(v.day).padStart(2,'0')}/${String(v.month).padStart(2,'0')}/${v.year}`;let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(v)}
function err(e){loading(false);let x=document.getElementById('error');x.style.display='block';x.textContent='Gagal memuatkan Dashboard:\n\n'+(e?.message||e||'Ralat tidak diketahui.')}
function loading(on){document.getElementById('loading').style.display=on?'block':'none';document.getElementById('content').style.display=on?'none':'block'}
function populate(list,selected){periods=(Array.isArray(list)?list:[]).filter(p=>parts(p.PeriodID||p.periodId));let ys=[...new Set(periods.map(p=>parts(p.PeriodID||p.periodId).year))].sort((a,b)=>b-a),y=document.getElementById('yearSelect');y.innerHTML=ys.map(v=>`<option value="${v}">${v}</option>`).join('');let p=parts(selected||currentPeriodId)||{year:ys[0],month:1};y.value=p.year;populateMonths(p.year,p.month);y.disabled=false;document.getElementById('monthSelect').disabled=false;updateApplyButton()}
function populateMonths(year,selected){let m=document.getElementById('monthSelect'),a=new Set(periods.map(p=>parts(p.PeriodID||p.periodId)).filter(x=>x&&x.year===+year).map(x=>x.month));m.innerHTML=[...a].sort((x,y)=>x-y).map(x=>`<option value="${String(x).padStart(2,'0')}">${months[x-1]}</option>`).join('');if(selected)m.value=String(selected).padStart(2,'0');if(!m.value&&m.options.length)m.selectedIndex=0}
function updateApplyButton(){let y=document.getElementById('yearSelect').value,m=document.getElementById('monthSelect').value,b=document.getElementById('applyPeriodBtn');if(!y||!m){b.disabled=true;return}b.disabled=(`${y}-${m}`===currentPeriodId)}
function loadPeriods(){google.script.run.withSuccessHandler(x=>populate(x,currentPeriodId)).withFailureHandler(()=>{}).getSecretariatPeriodsV2()}
function yearChanged(){let y=+document.getElementById('yearSelect').value;if(!y)return;populateMonths(y,1);updateApplyButton()}
function monthChanged(){updateApplyButton()}
function applySelectedPeriod(){let y=document.getElementById('yearSelect').value,m=document.getElementById('monthSelect').value;if(!y||!m)return;changePeriod()}
function changePeriod(){let y=document.getElementById('yearSelect').value,m=document.getElementById('monthSelect').value;if(!y||!m)return;let id=`${y}-${m}`;if(id===currentPeriodId){updateApplyButton();return}currentPeriodId=id;loadDashboard(id)}
function loadDashboard(id){loading(true);document.getElementById('error').style.display='none';google.script.run.withSuccessHandler(d=>{try{render(d);loadPeriods()}catch(e){err(e)}}).withFailureHandler(err).getSecretariatDashboardV2(id||'')}
function render(d){let p=d.period||{},s=d.summary||{};currentPeriodId=p.PeriodID||currentPeriodId;document.getElementById('periodText').textContent=`${p.Month||''} ${p.Year||''} | ${dateText(p.OpenDate)} hingga ${dateText(p.CloseDate)}`;['total','submitted','draft','notStarted','closed'].forEach(k=>document.getElementById(k).textContent=s[k]??0);let pc=s.total?Math.round(((s.submitted||0)+(s.closed||0))/s.total*100):0;document.getElementById('fill').style.width=pc+'%';document.getElementById('progressText').textContent=pc+'%';rows=Array.isArray(d.rows)?d.rows:[];filterTable();loading(false);updateApplyButton()}
function filterTable(){let q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('statusFilter')?.value||'ALL',a=rows.filter(r=>(!q||`${r.name||''} ${r.code||''}`.toLowerCase().includes(q))&&(f==='ALL'||String(r.status||'NOT_STARTED').toUpperCase()===f));document.getElementById('count').textContent=`${a.length} daripada ${rows.length} organisasi`;document.getElementById('tbody').innerHTML=a.length?a.map((r,i)=>{let st=String(r.status||'NOT_STARTED').toUpperCase(),rid=r.reportId||'';return `<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.code)}</td><td>${status(st)}</td><td>${Number(r.completion||0)}%</td><td><button class="btn" onclick="${rid?`viewReport('${esc(rid)}',this)`: `showNoReport('${esc(r.name)}','${esc(r.code)}')`}">${rid?'Lihat':'Semak'}</button></td></tr>`}).join(''):`<tr><td colspan="6" style="text-align:center;color:#6b7280;padding:25px">Tiada organisasi sepadan.</td></tr>`}
function showNoReport(name,code){document.getElementById('modal').style.display='block';document.getElementById('modalTitle').textContent='Tiada Laporan';document.getElementById('modalMeta').innerHTML=`<b>Kod:</b> ${esc(code)} &nbsp; | &nbsp; <b>Tempoh:</b> ${esc(currentPeriodId)}`;document.getElementById('modalBody').innerHTML=`<div style="padding:30px;text-align:center;color:#6b7280"><div style="font-size:42px;margin-bottom:10px">📄</div><b style="font-size:18px;color:#17365d">Tiada rekod laporan</b><p>Tiada laporan direkodkan untuk <b>${esc(name)}</b> bagi tempoh <b>${esc(currentPeriodId)}</b>.</p></div>`}
function viewReport(id,b){if(!id)return;document.getElementById('modal').style.display='block';document.getElementById('modalBody').innerHTML='<div style="padding:30px;text-align:center">Memuatkan laporan...</div>';b.disabled=true;google.script.run.withSuccessHandler(d=>{b.disabled=false;renderReport(d)}).withFailureHandler(e=>{b.disabled=false;document.getElementById('modalBody').innerHTML=`<div style="color:#b91c1c">${esc(e?.message||e)}</div>`}).getReadOnlyReport(id)}
function closeReport(){document.getElementById('modal').style.display='none'}
function field(l,v){return v==null||v===''?'':`<div class="v"><b>${l}</b><span>${esc(v)}</span></div>`}
function renderReport(d){let r=d.report||d.Report||d,p=d.period||{},items=d.items||d.reportItems||[],acts=d.activities||[];document.getElementById('modalTitle').textContent=r.OrganisationName||r.organisationName||'Laporan Bulanan CGSO';document.getElementById('modalMeta').innerHTML=`<b>Kod:</b> ${esc(r.Code||r.OrganisationCode||'')} &nbsp; | &nbsp; <b>Tempoh:</b> ${esc(p.Month||p.PeriodID||r.PeriodID||'')} &nbsp; | &nbsp; <b>Status:</b> ${esc(r.Status||'DRAFT')}`;let g={};items.forEach(x=>(g[x.Section||x.section||0]??=[]).push(x));let h='';Object.keys(g).sort((a,b)=>+a-+b).forEach(sec=>{h+=`<div class="sec"><div class="sect">BAHAGIAN ${esc(sec)}</div>`;g[sec].forEach(it=>{let c=it.ItemCode||it.itemCode||'',st=String(it.Status||it.status||'').toUpperCase(),aa=acts.filter(a=>String(a.ItemCode||a.itemCode||'')===String(c));h+=`<div class="item"><span class="code">${esc(c)}</span><b>${esc(it.ItemName||it.itemName||'')}</b><span class="pill ${st==='ADA'?'ada':'tiada'}">${esc(st)}</span>`;aa.forEach(a=>{h+=`<div class="act"><div class="grid">${field('Tarikh Mula',a.startDate)}${field('Tarikh Akhir',a.endDate)}${field('Masa Mula',a.timeStart)}${field('Masa Tamat',a.timeEnd)}${field('Tajuk / Perkara',a.title)}${field('Kementerian / Jabatan / Agensi',a.agency)}${field('Lokasi',a.location||a.locationType)}${field('Pegawai Terlibat',a.officers)}${field('Penceramah',a.speakers)}${field('Peserta',a.participants)}${field('Jumlah',a.quantity)}${field('Catatan',a.notes)}</div></div>`});h+='</div>'});h+='</div>'});document.getElementById('modalBody').innerHTML=h||'<div style="padding:20px;color:#6b7280">Tiada data laporan untuk dipaparkan.</div>'}
window.addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeReport()});window.addEventListener('load',()=>loadDashboard(''));
</script></body></html>
