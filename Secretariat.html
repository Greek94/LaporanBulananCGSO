<div class="header"><h1 class="title">DASHBOARD URUS SETIA</h1><p class="subtitle" id="periodText">Memuatkan tempoh laporan...</p><div class="period-tools"><div class="period-field"><label for="yearSelect">TAHUN</label><select id="yearSelect" class="period-select" onchange="yearChanged()" disabled><option>Memuatkan...</option></select></div><div class="period-field"><label for="monthSelect">BULAN</label><select id="monthSelect" class="period-select" onchange="monthChanged()" disabled><option>Memuatkan...</option></select></div><button type="button" id="applyPeriodBtn" class="period-btn" onclick="applySelectedPeriod()" disabled>🔎 Papar Tempoh</button><span class="period-help">Pilih tahun dan bulan, kemudian klik Papar Tempoh.</span></div></div>
<div id="loading" class="loading">Memuatkan data...</div><div id="errorBox" class="error" style="display:none"></div><div id="content" style="display:none"><div class="stats"><div class="stat"><div class="stat-label">Jumlah Organisasi</div><div id="total" class="stat-value">0</div></div><div class="stat"><div class="stat-label">Telah Hantar</div><div id="submitted" class="stat-value">0</div></div><div class="stat"><div class="stat-label">Draf</div><div id="draft" class="stat-value">0</div></div><div class="stat"><div class="stat-label">Belum Mula</div><div id="notStarted" class="stat-value">0</div></div><div class="stat"><div class="stat-label">Ditutup</div><div id="closed" class="stat-value">0</div></div></div><div class="progress-card"><div class="progress-title">Kemajuan Laporan</div><div class="progress-bar"><div id="fill" class="progress-fill"></div></div><div id="progressText" class="progress-text">0%</div></div><div class="table-card"><div class="toolbar"><input id="search" class="search-box" placeholder="Cari organisasi atau kod..." oninput="applyTableFilter()"><select id="statusFilter" class="filter-select" onchange="applyTableFilter()"><option value="ALL">Semua Status</option><option value="SUBMITTED">Telah Hantar</option><option value="DRAFT">Draf</option><option value="NOT_STARTED">Belum Mula</option><option value="CLOSED">Ditutup</option></select><button type="button" class="refresh-btn" onclick="loadDashboard()">↻ Segar Semula</button><span id="resultCount" class="result-count"></span></div><table><thead><tr><th style="width:50px">Bil.</th><th>Organisasi</th><th style="width:120px">Kod</th><th style="width:130px">Status</th><th style="width:100px">Kemajuan</th><th style="width:110px">Tindakan</th></tr></thead><tbody id="tableBody"></tbody></table></div></div></div>

<script>
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");}function dateText(v){if(!v)return "";if(typeof v==="object"){if(v.year!=null&&v.month!=null&&v.day!=null)return String(v.day).padStart(2,"0")+"/"+String(v.month).padStart(2,"0")+"/"+v.year;return "";}var s=String(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[3]+"/"+m[2]+"/"+m[1];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0")+"/"+m[3];return s;}function getPeriodName(p){if(!p)return "Tempoh tidak dinyatakan";if(typeof p==="string")return p;return p.Month||p.month||p.PeriodName||p.periodName||p.PeriodID||"Tempoh laporan";}function getPeriodStart(p){if(!p||typeof p==="string")return "";return dateText(p.OpenDate||p.openDate||p.StartDate||p.startDate);}function getPeriodEnd(p){if(!p||typeof p==="string")return "";return dateText(p.CloseDate||p.closeDate||p.EndDate||p.endDate);}function statusClass(s){s=String(s||"NOT_STARTED").toUpperCase();if(s==="SUBMITTED")return "status submitted";if(s==="CLOSED")return "status closed";if(s==="DRAFT")return "status draft";return "status notstarted";}function statusLabel(s){s=String(s||"NOT_STARTED").toUpperCase();if(s==="SUBMITTED")return "TELAH HANTAR";if(s==="CLOSED")return "DITUTUP";if(s==="DRAFT")return "DRAF";return "BELUM MULA";}function pct(row){var n=Number(row&&(row.completion!=null?row.completion:row.completionPercent));return isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):0;}function showError(e){var msg=e&&e.message?e.message:String(e||"Ralat tidak diketahui.");document.getElementById("loading").style.display="none";document.getElementById("content").style.display="none";var box=document.getElementById("errorBox");box.style.display="block";box.textContent="Gagal memuatkan Dashboard Urus Setia:\n\n"+msg;}
var currentDashboardRows=[],currentPeriodId="",currentPeriod=null,periodList=[],monthNames=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];function periodLabel(p){return getPeriodName(p);}function periodParts(id){var m=String(id||"").match(/^(\d{4})-(\d{2})$/);return m?{year:Number(m[1]),month:Number(m[2])}:null;}function setPeriodOptions(list,selected){var ys=document.getElementById('yearSelect'),ms=document.getElementById('monthSelect');if(!ys||!ms)return;var seen={},arr=[];(Array.isArray(list)?list:[]).forEach(function(p){var id=String(p&&(p.PeriodID||p.periodId)||"");if(id&&!seen[id]){seen[id]=true;arr.push(p);}});arr.sort(function(a,b){return String(b.PeriodID||b.periodId||"").localeCompare(String(a.PeriodID||a.periodId||""));});periodList=arr;var years=[];arr.forEach(function(p){var x=periodParts(p.PeriodID||p.periodId);if(x&&years.indexOf(x.year)<0)years.push(x.year);});ys.innerHTML="";years.sort(function(a,b){return b-a;});if(!years.length){ys.innerHTML='<option value="">Tiada tahun</option>';ys.disabled=true;ms.disabled=true;return;}years.forEach(function(y){var o=document.createElement('option');o.value=String(y);o.textContent=String(y);ys.appendChild(o);});var sel=periodParts(selected||currentPeriodId)||periodParts(arr[0].PeriodID||arr[0].periodId);ys.value=String(sel.year);populateMonths(sel.year,sel.month);ys.disabled=false;ms.disabled=false;updateApplyButton();}function populateMonths(year,selected){var ms=document.getElementById('monthSelect'),nums=[];periodList.forEach(function(p){var x=periodParts(p.PeriodID||p.periodId);if(x&&x.year===Number(year)&&nums.indexOf(x.month)<0)nums.push(x.month);});nums.sort(function(a,b){return a-b;});ms.innerHTML="";nums.forEach(function(m){var o=document.createElement('option');o.value=String(m).padStart(2,'0');o.textContent=monthNames[m-1];ms.appendChild(o);});if(selected)ms.value=String(selected).padStart(2,'0');if(!ms.value&&ms.options.length)ms.selectedIndex=0;}function updateApplyButton(){var y=document.getElementById('yearSelect').value,m=document.getElementById('monthSelect').value,b=document.getElementById('applyPeriodBtn');if(!y||!m){b.disabled=true;return;}b.disabled=(y+'-'+m===currentPeriodId);}function yearChanged(){var y=Number(document.getElementById('yearSelect').value);if(!y)return;populateMonths(y,1);updateApplyButton();}function monthChanged(){updateApplyButton();}function applySelectedPeriod(){changePeriod();}function changePeriod(){var y=document.getElementById('yearSelect').value,m=document.getElementById('monthSelect').value;if(!y||!m)return;var id=y+'-'+m;if(id===currentPeriodId){updateApplyButton();return;}currentPeriodId=id;loadDashboard(id);}function loadPeriodList(){google.script.run.withSuccessHandler(function(list){setPeriodOptions(list,currentPeriodId);}).withFailureHandler(function(){}).getSecretariatPeriodsV2();}
function render(data){var p=data.period||{},s=data.summary||{};currentPeriod=p;currentPeriodId=p.PeriodID||currentPeriodId;document.getElementById('periodText').textContent=getPeriodName(p)+' | '+getPeriodStart(p)+' hingga '+getPeriodEnd(p);document.getElementById('total').textContent=s.total||0;document.getElementById('submitted').textContent=s.submitted||0;document.getElementById('draft').textContent=s.draft||0;document.getElementById('notStarted').textContent=s.notStarted||0;document.getElementById('closed').textContent=s.closed||0;var pc=s.total?Math.round(((s.submitted||0)+(s.closed||0))/s.total*100):0;document.getElementById('fill').style.width=pc+'%';document.getElementById('progressText').textContent=pc+'%';currentDashboardRows=Array.isArray(data.rows)?data.rows:[];applyTableFilter();updateApplyButton();}function applyTableFilter(){var q=(document.getElementById('search').value||'').toLowerCase().trim(),f=document.getElementById('statusFilter').value||'ALL',rows=currentDashboardRows.filter(function(r){var text=(r.name||'')+' '+(r.code||'');var st=String(r.status||'NOT_STARTED').toUpperCase();return(!q||text.toLowerCase().indexOf(q)>=0)&&(f==='ALL'||st===f);});var body=document.getElementById('tableBody');body.innerHTML='';rows.forEach(function(r,i){var tr=document.createElement('tr'),st=String(r.status||'NOT_STARTED').toUpperCase(),rid=r.reportId||'';tr.innerHTML='<td>'+(i+1)+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.code)+'</td><td><span class="'+statusClass(st)+'">'+esc(statusLabel(st))+'</span></td><td>'+pct(r)+'%</td><td><button type="button">'+(rid?'Lihat':'Semak')+'</button></td>';var btn=tr.querySelector('button');btn.onclick=function(){if(rid)viewReport(rid,btn);else showNoReport(r.name,r.code);};body.appendChild(tr);});document.getElementById('resultCount').textContent=rows.length+' daripada '+currentDashboardRows.length+' organisasi';}
function showNoReport(name,code){var modal=document.getElementById('reportModal');modal.style.display='block';document.getElementById('modalTitle').textContent='Tiada Laporan';document.getElementById('modalMeta').innerHTML='<strong>Kod:</strong> '+esc(code)+' &nbsp; | &nbsp; <strong>Tempoh:</strong> '+esc(periodLabel(currentPeriod));document.getElementById('modalBody').className='';document.getElementById('modalBody').innerHTML='<div style="padding:28px;text-align:center"><div style="font-size:42px;margin-bottom:10px">📄</div><h3 style="margin:0 0 8px;color:#17365d">Tiada rekod laporan</h3><p style="margin:0;color:#6b7280;line-height:1.6">Tiada laporan direkodkan untuk <b>'+esc(name)+' ('+esc(code)+')</b> bagi tempoh <b>'+esc(periodLabel(currentPeriod))+'</b>.</p></div>';}
function viewReport(reportId,btn){var modal=document.getElementById('reportModal'),body=document.getElementById('modalBody');modal.style.display='block';body.className='modal-loading';body.textContent='Memuatkan laporan...';if(btn)btn.disabled=true;google.script.run.withSuccessHandler(function(data){if(btn)btn.disabled=false;try{renderReport(data);}catch(e){body.className='';body.innerHTML='<div class="empty">Ralat memaparkan laporan: '+esc(e.message||e)+'</div>';}}).withFailureHandler(function(e){if(btn)btn.disabled=false;body.className='';body.innerHTML='<div class="empty" style="color:#b91c1c">Gagal mendapatkan laporan:<br><br>'+esc(e.message||e)+'</div>';}).getReadOnlyReport(reportId);}
function statusPill(s){s=String(s||'').toUpperCase();if(s==='ADA')return '<span class="item-status ada">ADA</span>';if(s==='TIADA')return '<span class="item-status tiada">TIADA</span>';return '<span class="item-status kosong">BELUM DIISI</span>';}function itemStatus(data,code){var x=(data.itemStatus||{})[code];if(!x)return '';return String(x.status||x.Status||'').toUpperCase();}function activityValue(a,key){var map={startDate:['StartDate','startDate'],endDate:['EndDate','endDate'],timeStart:['TimeStart','timeStart'],timeEnd:['TimeEnd','timeEnd'],title:['Title','title'],agency:['Agency','agency'],location:['Location','location'],locationType:['LocationType','locationType'],officers:['Officers','officers'],speakers:['Speakers','speakers'],participants:['Participants','participants'],candidatesPresent:['CandidatesPresent','candidatesPresent'],candidatesAbsent:['CandidatesAbsent','candidatesAbsent'],quantity:['Quantity','quantity'],notes:['Notes','notes']};var ks=map[key]||[key];for(var i=0;i<ks.length;i++)if(a&&a[ks[i]]!=null&&String(a[ks[i]])!=='')return a[ks[i]];return '';}function fieldBox(label,value){if(value==null||String(value)==='')return '';return '<div class="view-field"><div class="view-label">'+esc(label)+'</div><div class="view-value">'+esc(value)+'</div></div>';}function renderActivityCard(item,a,index){var h='<div class="activity-card"><div class="activity-number">Rekod '+(index+1)+'</div><div class="view-grid">';h+=fieldBox('Tarikh Mula',dateText(activityValue(a,'startDate')));h+=fieldBox('Tarikh Akhir',dateText(activityValue(a,'endDate')));h+=fieldBox('Masa Mula',activityValue(a,'timeStart'));h+=fieldBox('Masa Tamat',activityValue(a,'timeEnd'));h+=fieldBox('Tajuk / Perkara',activityValue(a,'title'));h+=fieldBox('Kementerian / Jabatan / Agensi',activityValue(a,'agency'));h+=fieldBox('Lokasi',activityValue(a,'location')||activityValue(a,'locationType'));h+=fieldBox('Pegawai Terlibat',activityValue(a,'officers'));h+=fieldBox('Penceramah',activityValue(a,'
