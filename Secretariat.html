<div class="container"><div class="card"><h1 class="title">DASHBOARD URUS SETIA</h1><div id="periodText" class="muted">Memuatkan tempoh laporan...</div><div class="period-tools"><div class="field"><label>TAHUN</label><select id="yearSelect" class="select" disabled><option>Memuatkan...</option></select></div><div class="field"><label>BULAN</label><select id="monthSelect" class="select" disabled><option>Memuatkan...</option></select></div><button id="applyBtn" class="btn dark" type="button" disabled>Papar Tempoh</button><button id="refreshBtn" class="btn" type="button">Segar Semula</button><button id="homeBtn" class="btn gray" type="button">← Kembali ke Homepage</button></div></div>

<script>
var rows=[],periodList=[],currentPeriodId="",currentPeriod=null,reportData=null;
var months=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
function $(id){return document.getElementById(id)}function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}

function periodParts(id){var m=String(id||"").match(/^(\d{4})-(\d{2})$/);return m?{year:Number(m[1]),month:Number(m[2])}:null}

function showError(e){$("loading").style.display="none";$("content").style.display="none";$("errorBox").style.display="block";$("errorBox").textContent="Gagal memuatkan Dashboard Urus Setia:\n\n"+(e&&e.message?e.message:String(e||"Ralat tidak diketahui."))}
function updateButton(){var y=$("yearSelect").value,m=$("monthSelect").value;$("applyBtn").disabled=!(y&&m&&y+"-"+m!==currentPeriodId)}

function setPeriods(list){periodList=Array.isArray(list)?list:[];var ys=$("yearSelect"),seen={},years=[];periodList.forEach(function(p){var id=String(p.PeriodID||p.periodId||"");if(!seen[id]){seen[id]=1;var x=periodParts(id);if(x&&years.indexOf(x.year)<0)years.push(x.year)}});years.sort(function(a,b){return b-a});ys.innerHTML="";years.forEach(function(y){var o=document.createElement("option");o.value=y;o.textContent=y;ys.appendChild(o)});if(!years.length){ys.innerHTML="<option>Tiada tahun</option>";ys.disabled=true;$("monthSelect").disabled=true;return}var cur=periodParts(currentPeriodId)||periodParts(periodList[0].PeriodID||periodList[0].periodId);ys.value=cur.year;populateMonths(cur.year,cur.month);ys.disabled=false;updateButton()}
function loadPeriods(){google.script.run.withSuccessHandler(setPeriods).withFailureHandler(function(e){showError(e)}).getSecretariatPeriodsV2()}
function loadDashboard(id){$("loading").style.display="block";$("content").style.display="none";$("errorBox").style.display="none";google.script.run.withSuccessHandler(function(data){try{renderDashboard(data)}catch(e){showError(e)}}).withFailureHandler(showError).getSecretariatDashboardV2(id||"")}
function renderDashboard(data){if(!data)throw new Error("Backend tidak memulangkan data.");currentPeriod=data.period||{};currentPeriodId=String(currentPeriod.PeriodID||currentPeriod.periodId||currentPeriodId);rows=Array.isArray(data.rows)?data.rows:[];var s=data.summary||{};$("periodText").textContent=periodName(currentPeriod)+" | "+dateText(currentPeriod.OpenDate)+" hingga "+dateText(currentPeriod.CloseDate);$("total").textContent=s.total||rows.length;$("submitted").textContent=s.submitted||0;$("draft").textContent=s.draft||0;$("notStarted").textContent=s.notStarted||0;$("closed").textContent=s.closed||0;var total=Number(s.total||rows.length),done=Number(s.submitted||0)+Number(s.closed||0),pc=total?Math.round(done/total*100):0;$("progressFill").style.width=pc+"%";$("progressText").textContent=pc+"%";renderDeadline();$("loading").style.display="none";$("content").style.display="block";applyFilter();updateButton()}
function parseDateValue(v){if(!v)return null;if(typeof v==="object"&&v.year!=null)return new Date(Number(v.year),Number(v.month)-1,Number(v.day),23,59,59);var s=String(v).trim(),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),23,59,59);var dmy=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(dmy)return new Date(Number(dmy[3]),Number(dmy[2])-1,Number(dmy[1]),23,59,59);var d=new Date(s);return isNaN(d.getTime())?null:d}
function renderDeadline(){var close=parseDateValue(currentPeriod.CloseDate),dateEl=$("deadlineDate"),statusEl=$("deadlineStatus"),noteEl=$("deadlineNote"),listEl=$("pendingList");if(!close){dateEl.textContent=dateText(currentPeriod.CloseDate)||"-";statusEl.textContent="Tarikh tidak tersedia";statusEl.className="deadline-status";noteEl.textContent="Sila semak tetapan tempoh laporan.";listEl.innerHTML="";return}dateEl.textContent=dateText(currentPeriod.CloseDate);var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0),end=new Date(close.getFullYear(),close.getMonth(),close.getDate(),23,59,59),days=Math.ceil((end.getTime()-today.getTime())/86400000);statusEl.className="deadline-status";if(days<0){statusEl.textContent="TELAH TAMAT";statusEl.className+=" closed";noteEl.textContent="Tempoh penghantaran telah berakhir."}else if(days===0){statusEl.textContent="TAMAT HARI INI";statusEl.className+=" danger";noteEl.textContent="Sila pastikan laporan yang berkaitan telah dihantar."}else if(days<=3){statusEl.textContent=days+" HARI LAGI";statusEl.className+=" danger";noteEl.textContent="Tempoh penghantaran hampir tamat. Utamakan organisasi yang belum menghantar laporan."}else if(days<=7){statusEl.textContent=days+" HARI LAGI";statusEl.className+=" warning";noteEl.textContent="Tempoh penghantaran semakin hampir."}else{statusEl.textContent=days+" HARI LAGI";noteEl.textContent="Tempoh penghantaran masih dibuka."}var pending=rows.filter(function(r){var s=String(r.status||"NOT_STARTED").toUpperCase();return s!=="SUBMITTED"&&s!=="CLOSED"});if(!pending.length){listEl.innerHTML="<span class='muted'>Semua organisasi telah menghantar laporan.</span>"}else{var max=10,h=pending.slice(0,max).map(function(r){return "<span class='pending-item'>"+esc(String(r.name||r.code||"Organisasi"))+"</span>"}).join("");if(pending.length>max)h+="<span class='pending-more'>+ "+(pending.length-max)+" lagi</span>";listEl.innerHTML=h}}
function applyFilter(){var q=$("searchBox").value.toLowerCase().trim(),f=$("statusFilter").value,body=$("tableBody");body.innerHTML="";var shown=0;rows.forEach(function(r){var name=String(r.name||"");var code=String(r.code||"");var st=String(r.status||"NOT_STARTED").toUpperCase();if(q&&(name+" "+code).toLowerCase().indexOf(q)<0)return;if(f!=="ALL"&&st!==f)return;shown++;var tr=document.createElement("tr");tr.innerHTML="<td>"+shown+"</td><td><b>"+esc(name)+"</b></td><td>"+esc(code)+"</td><td><span class='"+statusClass(st)+"'>"+statusLabel(st)+"</span></td><td>"+Number(r.completion||0)+"%</td><td><button class='btn' type='button'>"+(r.reportId?"Lihat":"Semak")+"</button></td>";var b=tr.querySelector("button");b.onclick=function(){r.reportId?viewReport(r.reportId,b):noReport(name,code)};body.appendChild(tr)});$("resultCount").textContent=shown+" daripada "+rows.length+" organisasi";if(!shown)body.innerHTML="<tr><td colspan='6' style='text-align:center;padding:25px;color:#6b7280'>Tiada organisasi sepadan.</td></tr>"}
function noReport(name,code){$("reportModal").style.display="block";$("modalTitle").textContent="Tiada Laporan";$("modalMeta").textContent="Kod: "+code+" | Tempoh: "+periodName(currentPeriod);$("modalBody").innerHTML="<div class='empty'><h3>Tiada rekod laporan</h3>Tiada laporan direkodkan untuk <b>"+esc(name)+" ("+esc(code)+")</b> bagi tempoh <b>"+esc(periodName(currentPeriod))+"</b>.</div>"}
function val(a,keys){for(var i=0;i<keys.length;i++)if(a&&a[keys[i]]!=null&&String(a[keys[i]])!=="")return a[keys[i]];return ""}function kv(label,v){if(v==null||String(v)==="")return "";return "<div class='kv'><small>"+label+"</small>"+esc(v)+"</div>"}
function renderActivity(a){return "<div class='activity'><div class='grid'>"+kv("Tarikh Mula",dateText(val(a,["StartDate","startDate"])))+kv("Tarikh Akhir",dateText(val(a,["EndDate","endDate"])))+kv("Masa Mula",val(a,["TimeStart","timeStart"]))+kv("Masa Tamat",val(a,["TimeEnd","timeEnd"]))+kv("Tajuk / Perkara",val(a,["Title","title"]))+kv("Kementerian / Jabatan / Agensi",val(a,["Agency","agency"]))+kv("Lokasi",val(a,["Location","location"]))+kv("Jenis Lokasi",val(a,["LocationType","locationType"]))+kv("Pegawai Terlibat",val(a,["Officers","officers"]))+kv("Penceramah",val(a,["Speakers","speakers"]))+kv("Peserta",val(a,["Participants","participants"]))+kv("Jumlah",val(a,["Quantity","quantity"]))+kv("Calon Hadir",val(a,["CandidatesPresent","candidatesPresent"]))+kv("Calon Tidak Hadir",val(a,["CandidatesAbsent","candidatesAbsent"]))+"</div>"+kv("Catatan",val(a,["Notes","notes"]))+"</div>"}
function viewReport(id,btn){if(btn)btn.disabled=true;$("reportModal").style.display="block";$("modalBody").innerHTML="<div class='empty'>Memuatkan laporan...</div>";google.script.run.withSuccessHandler(function(data){if(btn)btn.disabled=false;try{renderReport(data)}catch(e){$("modalBody").innerHTML="<div class='empty' style='color:#b91c1c'>Ralat: "+esc(e.message||e)+"</div>"}}).withFailureHandler(function(e){if(btn)btn.disabled=false;$("modalBody").innerHTML="<div class='empty' style='color:#b91c1c'>Gagal mendapatkan laporan:<br><br>"+esc(e.message||e)+"</div>"}).getReadOnlyReport(id)}
function renderReport(data){if(!data)throw new Error("Tiada data laporan.");reportData=data;var r=data.report||data.Report||data,p=data.period||{},name=r.OrganisationName||r.organisationName||"Organisasi",code=r.Code||r.OrganisationCode||"-",st=String(r.Status||r.status||"DRAFT").toUpperCase();$("modalTitle").textContent=name;$("modalMeta").innerHTML="<b>Kod:</b> "+esc(code)+" | <b>Tempoh:</b> "+esc(periodName(p))+" | <b>Status:</b> "+esc(statusLabel(st));var body=$("modalBody"),items=Array.isArray(data.items)?data.items:(data.reportItems||[]),acts=Array.isArray(data.activities)?data.activities:(data.Activities||[]),groups={};items.forEach(function(it){var sec=Number(it.Section||it.section||0);if(!groups[sec])groups[sec]=[];groups[sec].push(it)});var h="<div class='summary'>"+kv("Status",statusLabel(st))+kv("Kemajuan",(r.CompletionPercent!=null?r.CompletionPercent:(r.completionPercent||0))+"%")+kv("Tarikh Hantar",dateText(r.SubmittedAt||r.submittedAt)||"-")+kv("Kemaskini Terakhir",dateText(r.UpdatedAt||r.updatedAt)||"-")+"</div>";Object.keys(groups).sort(function(a,b){return Number(a)-Number(b)}).forEach(function(sec){h+="<div class='section'><h3>BAHAGIAN "+esc(sec)+"</h3>";groups[sec].sort(function(a,b){return Number(a.DisplayOrder||0)-Number(b.DisplayOrder||0)}).forEach(function(it){var code=it.ItemCode||it.itemCode||"",is=(data.itemStatus||{})[code],status=String(is&&(is.status||is.Status)||"").toUpperCase(),ia=acts.filter(function(a){return String(a.ItemCode||a.itemCode||"")===String(code)});h+="<div class='item'><div class='itemhead'><b>"+esc(code)+" — "+esc(it.ItemName||it.itemName||"")+"</b></div>"+(status==="ADA"?(ia.length?ia.map(renderActivity).join(""):"<div class='muted' style='margin-top:8px'>Tiada rekod aktiviti.</div>"):status==="TIADA"?"<div class='muted' style='margin-top:8px'>Tiada aktiviti direkodkan bagi item ini untuk tempoh laporan.</div>":"<div class='muted' style='margin-top:8px'>Item belum diisi oleh organisasi.</div>")+"</div>"});h+="</div>
