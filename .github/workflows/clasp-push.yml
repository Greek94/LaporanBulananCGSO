name: Apps Script - Manual Push

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ] || [ -z "$CLASP_JSON" ]; then
            echo "Required GitHub secrets CLASPRC_JSON and CLASP_JSON are missing."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$GITHUB_WORKSPACE/.clasp.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8')); JSON.parse(require('fs').readFileSync('.clasp.json','utf8'));"

      - name: Check Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.gs )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No root-level .gs files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check < "${file}"
          done

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Create version and update web app deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          DESC="GitHub Actions ${GITHUB_SHA::7}"

          if [ -n "${DEPLOYMENT_ID}" ]; then
            # Kemas kini deployment sedia ada (URL web app kekal sama).
            # clasp 3.x: create-deployment; clasp 2.x: deploy.
            clasp create-deployment --deploymentId "${DEPLOYMENT_ID}" --description "${DESC}" \
              || clasp deploy --deploymentId "${DEPLOYMENT_ID}" --description "${DESC}"
            echo "Deployment ${DEPLOYMENT_ID} dikemas kini."
          else
            # Tiada APPS_SCRIPT_DEPLOYMENT_ID: cipta version sahaja.
            # Pilih version baharu secara manual di Deploy > Manage deployments.
            clasp create-version "${DESC}" || clasp version "${DESC}"
            echo "::warning::Secret APPS_SCRIPT_DEPLOYMENT_ID tiada. Version dicipta tetapi web app BELUM dikemas kini."
          fi
