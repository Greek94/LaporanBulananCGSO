name: Apps Script syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Google Apps Script JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.gs )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .gs files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check < "${file}"
          done

      - name: Check combined project scope (duplicate const/let)
        shell: bash
        run: |
          set -euo pipefail
          # Apps Script memuatkan semua .gs dalam satu skop global.
          cat *.gs > /tmp/apps-script-combined.js
          node --check /tmp/apps-script-combined.js

      - name: Detect duplicate function names
        shell: bash
        run: |
          set -euo pipefail
          dups=$(grep -ho '^function [A-Za-z0-9_$]*' *.gs | sort | uniq -d || true)
          if [ -n "$dups" ]; then
            echo "Fungsi pendua ditemui (versi terakhir dimuat akan menang):"
            echo "$dups"
            exit 1
          fi
