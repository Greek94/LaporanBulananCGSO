name: Apps Script syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Google Apps Script JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.gs )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .gs files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check < "${file}"
          done
